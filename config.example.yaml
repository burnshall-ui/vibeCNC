# Vibe CNC — configuration template.
#
# Copied to config.yaml on first start. config.yaml itself is not under version
# control: the settings dialog writes it, so every save would otherwise show up
# as a diff carrying one machine's paths and limits. Edit this file for defaults
# that should ship with the repository; edit config.yaml (or use the settings
# dialog) for the machine in front of you.
#
# Note that the dialog rewrites config.yaml with yaml.dump, which drops
# comments. That is why the explanations live here and not there.

ui:
  font_base_pt: 10
  dark_bg: '#1A1A1A'
  black_bg: '#000000'
  fanuc_yellow: '#FFC800'
  crt_green: '#6CFF6C'
  crt_green_dim: '#4ACF4A'
  cyan: '#56D6FF'
  white: '#EDEDED'

paths:
  camotics_exe: C:\Program Files (x86)\CAMotics\camotics.exe
  sim_share: \\linuxcnc-vm\sim\incoming

machine:
  # Z of the chuck face. Anything behind it is inside the chuck.
  chuck_z_limit: -100.0

  # Outside diameter over the jaws, in mm. MEASURE IT — do not estimate.
  # The collision check reports a move only where it is both behind the face
  # and no wider than the jaws, so a value that is too small makes the
  # simulator call moves safe that would crash.
  # While this is null, every diameter behind the face counts as blocked:
  # a false alarm rather than a missed crash.
  chuck_diameter: null

policies:
  # M-codes the shop mandates. Commenting one out is reported.
  protected_m_codes:
  - 62
  - 63
  - 64
  - 65
  # Expected in the first five code-carrying lines, comments not counted.
  require_header_codes:
  - G18
  - G40
  - G80
  - G97
  require_units: G21
  require_origin: G54

ai:
  # 'ollama' or 'anthropic'. Set offline: true to run with no backend at all —
  # editor, plotter, simulation, lint engine and the libraries all work without.
  mode: ollama
  offline: false
  anthropic:
    base_url: https://api.anthropic.com/v1/messages
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY
    max_output_tokens: 800
  ollama:
    base_url: http://127.0.0.1:11434/api/chat
    model: granite3.3:8b
    system_prompt: 'Du bist ein strenger CNC-Reviewer. Halte dich strikt an die Policies.

      Antworte mit: 1) Liste von Regelverstößen (Zeile, Regel, kurzer Fix),

      2) optional unified diff. Keine kosmetischen Änderungen.

      '
