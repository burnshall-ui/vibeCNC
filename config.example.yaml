# Vibe CNC — configuration template.
#
# Copied to config.yaml on first start. config.yaml itself is not under version
# control: the settings dialog writes it, so every save would otherwise show up
# as a diff carrying one machine's paths and limits. Edit this file for defaults
# that should ship with the repository; edit config.yaml (or use the settings
# dialog) for the machine in front of you.
#
# Note that the dialog rewrites config.yaml with yaml.dump, which drops
# comments. That is why the explanations live here and not there.

ui:
  font_base_pt: 10
  dark_bg: '#1A1A1A'
  black_bg: '#000000'
  fanuc_yellow: '#FFC800'
  crt_green: '#6CFF6C'
  crt_green_dim: '#4ACF4A'
  cyan: '#56D6FF'
  white: '#EDEDED'

paths:
  camotics_exe: C:\Program Files (x86)\CAMotics\camotics.exe
  sim_share: \\linuxcnc-vm\sim\incoming

machine:
  # Z of the chuck face. Anything behind it is inside the chuck.
  chuck_z_limit: -100.0

  # Outside diameter over the jaws, in mm. MEASURE IT — do not estimate.
  # The collision check reports a move only where it is both behind the face
  # and no wider than the jaws, so a value that is too small makes the
  # simulator call moves safe that would crash.
  # While this is null, every diameter behind the face counts as blocked:
  # a false alarm rather than a missed crash.
  chuck_diameter: null

policies:
  # M-codes the shop mandates. Commenting one out is reported.
  protected_m_codes:
  - 62
  - 63
  - 64
  - 65
  # Expected in the first five code-carrying lines, comments not counted.
  require_header_codes:
  - G18
  - G40
  - G80
  - G97
  require_units: G21
  require_origin: G54

ai:
  # 'claude' or 'ollama'. Set offline: true to run with no backend at all —
  # editor, plotter, simulation, lint engine and the libraries all work without.
  mode: ollama
  offline: false

  # What a review and a generation are told to do, for either backend. The
  # review one used to live under ollama: and is still read from there.
  system_prompt: 'You are a strict CNC reviewer. Follow the policies strictly.

    Answer with: 1) a list of rule violations (line, rule, short fix),

    2) optionally a unified diff. No cosmetic changes.

    '

  anthropic:
    # claude-sonnet-4-20250514 was retired on 2026-06-15; requests to it fail.
    # The current Sonnet is claude-sonnet-5-5. Cheaper: claude-haiku-5-5.
    # Stronger: claude-opus-5-5.
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
    # Thinking counts against this, so keep it generous. Without streaming the
    # most that is accepted is about 21000; the client caps it there.
    max_output_tokens: 16000
    # How hard the model thinks: low, medium, high, xhigh or max. Leave it empty
    # for a model that has no such setting (Haiku 4.5, Sonnet 4.5).
    effort: medium
    timeout_s: 180
    # Only for a proxy. The SDK knows the address; a whole endpoint ending in
    # /v1/messages, as older configs had, is still accepted.
    # base_url: https://api.anthropic.com

  ollama:
    # Another machine on the network works too: http://<host>:11434/api/chat
    base_url: http://127.0.0.1:11434/api/chat
    # About 18 GB of weights: a 32 GB machine, or a GPU with 24 GB. For less,
    # a smaller one such as qwen3.5:4b (about 3.5 GB) -- check it on your code.
    model: qwen3.8:27b
    # Ollama's own default is 4096 tokens below 24 GiB of VRAM. A review prompt
    # is 1000-1500 tokens, a long program can be 4000.
    num_ctx: 8192
    # qwen3.x and gpt-oss think before they answer, which on a small machine
    # takes minutes. false skips it. Remove the line for a model that does not
    # think: it would reject the field.
    think: false
    timeout_s: 300
