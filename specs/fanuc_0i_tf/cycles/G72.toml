code = "G72"
name = "Stock removal in facing (roughing along X)"
# Not "face": "from the face at Z0" is in almost every turning request.
keywords = ["facing", "face roughing", "plandrehen", "planschruppen", "querschruppen", "g72"]

[source]
text = """Drafted on 2026-11-21 from what this project's parser, linter and policies.md \
already assumed; checked the same day against the FANUC Series 0i-MODEL F operator's \
manual for the lathe system, B-64604EN-1/01, section 4.2.2 and the restrictions in 4.2.8. That manual is \
for the 0i-F, not the 0i-TF Plus of the machine. Not checked on the machine."""
verified = false
verified_on = ""

[[block]]                   # G72 W(d) R(e)
[block.words.W]
meaning = "depth of cut per pass along Z"
unit = "mm"
min_exclusive = 0
[block.words.R]
meaning = "retract after each pass"
unit = "mm"

[[block]]                   # G72 P(ns) Q(nf) U(du) W(dw) F
recognized_by = ["P", "Q"]
[block.words.P]
meaning = "first block of the contour, by its N number"
unit = "block number"
decimal_point = false
[block.words.Q]
meaning = "last block of the contour, by its N number"
unit = "block number"
decimal_point = false
[block.words.U]
meaning = "finishing allowance in X, a diameter"
unit = "mm"
[block.words.W]
meaning = "finishing allowance in Z"
unit = "mm"
[block.words.F]
meaning = "feed of the roughing passes"
min_exclusive = 0

[[assumption]]
text = "G72 is G71 turned round: the passes step W along Z from the start point towards the contour and each cuts along X, towards the centre line, until the contour stops it."
verified = false
manual = "4.2.2"

[[assumption]]
text = "Retract, allowance and the last cut along the contour are as in G71."
verified = false
manual = "4.2.2"

[[assumption]]
text = "Type I -- only Z in the first contour block -- needs a contour that moves one way only in Z and one way only in X: no pocket. Otherwise the control stops with alarm PS0064 or PS0329; the linter reports it as CYCLE_CONTOUR_TURNS_BACK. Type II, with X and Z in the first contour block (U0 when X does not move), may have pockets but still moves one way only in X; it is not judged."
verified = false
manual = "4.2.2"

[[assumption]]
text = "The first contour block carries G00 or G01 (else PS0065) and moves Z (else PS0325). G40, G41 or G42 between P and Q stop the control (PS0325)."
verified = false
manual = "4.2.2, 4.2.8"

[[example]]
title = "Ø80 bar: face down to Z-10 outside Ø40, leave a Ø40 boss faced to Z-5"
code = '''
G00 X82. Z2.
G72 W1.5 R0.5
G72 P10 Q20 U0.2 W0.1 F0.2
N10 G00 Z-10.
G01 X40. F0.1
Z-5.
N20 X0.
'''
