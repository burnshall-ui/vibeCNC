code = "G76"
name = "Multiple threading cycle"
# Keywords match whole words, so a German compound is listed as itself.
keywords = ["thread", "threads", "threading", "pitch", "lead", "gewinde", "außengewinde",
            "innengewinde", "gewindedrehen", "steigung", "g76"]

[source]
text = """Drafted on 2026-11-21 from what this project's parser, linter and policies.md \
already assumed; checked the same day against the FANUC Series 0i-MODEL F operator's \
manual for the lathe system, B-64604EN-1/01, section 4.2.7. That manual is for the \
0i-F, not the 0i-TF Plus of the machine. Not checked on the machine."""
verified = false
verified_on = ""

[[block]]                   # G76 P(m)(r)(a) Q(dmin) R(d) -- no X, Z, U or W
[block.words.P]
meaning = "finishing passes (mm), run-out in 0.1 of the lead (rr), tool angle in degrees (aa)"
form = "mmrraa"
decimal_point = false
[block.words.P.parts.m]
meaning = "finishing passes"
min = 1
max = 99
[block.words.P.parts.r]
meaning = "run-out, in 0.1 of the lead"
min = 0
max = 99
[block.words.P.parts.a]
meaning = "tool angle in degrees"
values = [80, 60, 55, 30, 29, 0]
[block.words.Q]
meaning = "minimum depth of cut, a radius"
unit = "0.001 mm"
decimal_point = false
min = 0
[block.words.R]
meaning = "finishing allowance"
unit = "mm"

[[block]]                   # G76 X(U) Z(W) R(i) P(k) Q(d) F(L)
recognized_by = ["X", "U", "Z", "W"]
[block.words.X]
meaning = "root diameter at the end of the thread"
unit = "mm"
[block.words.U]
meaning = "the same, from the start point"
unit = "mm"
[block.words.Z]
meaning = "end of the thread"
unit = "mm"
[block.words.W]
meaning = "the same, from the start point"
unit = "mm"
[block.words.R]
meaning = "taper: radius difference from the start to the end of the thread"
unit = "mm"
[block.words.P]
meaning = "thread height, a radius"
unit = "0.001 mm"
decimal_point = false
min_exclusive = 0
[block.words.Q]
meaning = "depth of the first cut, a radius"
unit = "0.001 mm"
decimal_point = false
min_exclusive = 0
[block.words.F]
meaning = "lead"
unit = "mm"
min_exclusive = 0

[[assumption]]
text = "The depth after n passes is the first cut * sqrt(n), so each pass takes about the same material; a pass that would add less than the minimum cut adds the minimum cut."
verified = false
manual = "4.2.7, fig. 4.2.7 (b)"

[[assumption]]
text = "Roughing stops short of the full height by the finishing allowance; the last pass, which takes off the allowance, is repeated mm times at the full height. The allowance must be smaller than the thread height."
verified = false
manual = "4.2.7"

[[assumption]]
text = "F is the lead. The manual does not say whether G98 changes that; it is taken to be the lead in either feed mode."
verified = false

[[assumption]]
text = "The control feeds in along one flank. The run-out rr leaves the thread over rr * 0.1 * lead at the angle in parameter 5131, 45 degrees when that is 0; drawn at 45 degrees. Which flank is not drawn."
verified = false
manual = "4.2.7"

[[example]]
title = "M20x2.5 external, 30 long"
code = '''
G00 X24. Z5.
G76 P020060 Q100 R0.05
G76 X16.93 Z-30. P1534 Q400 F2.5
'''
