code = "G76"
name = "Multiple threading cycle"
keywords = ["thread", "threading", "pitch", "lead", "gewinde", "gewindedrehen", "steigung", "g76"]

[source]
text = """Drafted on 2026-11-21 from what this project's parser, linter and policies.md \
already assumed, which came from training material and forum posts describing the \
Fanuc format. The manual itself was not read."""
verified = false
verified_on = ""

[[block]]                   # G76 P(m)(r)(a) Q(dmin) R(d) -- no X, Z, U or W
[block.words.P]
meaning = "finishing passes (mm), run-out in 0.1 of the lead (rr), tool angle in degrees (aa)"
form = "mmrraa"
decimal_point = false
[block.words.Q]
meaning = "minimum depth of cut, a radius"
unit = "0.001 mm"
decimal_point = false
min = 0
[block.words.R]
meaning = "finishing allowance"
unit = "mm"

[[block]]                   # G76 X(U) Z(W) R(i) P(k) Q(d) F(L)
recognized_by = ["X", "U", "Z", "W"]
[block.words.X]
meaning = "root diameter at the end of the thread"
unit = "mm"
[block.words.U]
meaning = "the same, from the start point"
unit = "mm"
[block.words.Z]
meaning = "end of the thread"
unit = "mm"
[block.words.W]
meaning = "the same, from the start point"
unit = "mm"
[block.words.R]
meaning = "taper: radius difference from the start to the end of the thread"
unit = "mm"
[block.words.P]
meaning = "thread height, a radius"
unit = "0.001 mm"
decimal_point = false
min_exclusive = 0
[block.words.Q]
meaning = "depth of the first cut, a radius"
unit = "0.001 mm"
decimal_point = false
min_exclusive = 0
[block.words.F]
meaning = "lead"
unit = "mm"
min_exclusive = 0

[[assumption]]
text = "The depth after n passes is the first cut * sqrt(n), so each pass takes about the same material; a pass never adds less than the minimum cut."
verified = false

[[assumption]]
text = "Roughing stops short of the full height by the finishing allowance; the finishing passes (mm) all run at the full height. mm = 00 is drawn as one finishing pass, where the control would take a parameter."
verified = false

[[assumption]]
text = "F is the lead whether G98 or G99 is active."
verified = false

[[assumption]]
text = "The run-out rr leaves the thread at 45 degrees over rr * 0.1 * lead. The tool angle aa makes the control feed in along one flank; which way is not drawn."
verified = false

[[example]]
title = "M20x2.5 external, 30 long"
code = '''
G00 X24. Z5.
G76 P020060 Q100 R0.05
G76 X16.93 Z-30. P1534 Q400 F2.5
'''
