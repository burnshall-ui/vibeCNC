code = "G73"
name = "Pattern repeating cycle (forgings, castings)"
keywords = ["pattern", "pattern repeating", "forging", "casting", "near net", "konturparallel", "schmiedeteil", "gussteil", "rohling", "g73"]

[source]
text = """Drafted on 2026-11-21 from what this project's parser, linter and policies.md \
already assumed; checked the same day against the FANUC Series 0i-MODEL F operator's \
manual for the lathe system, B-64604EN-1/01, section 4.2.3 and the restrictions in 4.2.8. That manual is \
for the 0i-F, not the 0i-TF Plus of the machine. Not checked on the machine."""
verified = false
verified_on = ""

[[block]]                   # G73 U(di) W(dk) R(d)
[block.words.U]
meaning = "relief in X, the stock to remove, a radius; signed by the direction of the relief"
unit = "mm"
[block.words.W]
meaning = "relief in Z, signed by the direction of the relief"
unit = "mm"
[block.words.R]
meaning = "number of passes"
unit = "count"
min_exclusive = 0

[[block]]                   # G73 P(ns) Q(nf) U(du) W(dw) F
recognized_by = ["P", "Q"]
[block.words.P]
meaning = "first block of the contour, by its N number"
unit = "block number"
decimal_point = false
[block.words.Q]
meaning = "last block of the contour, by its N number"
unit = "block number"
decimal_point = false
[block.words.U]
meaning = "finishing allowance in X, a diameter"
unit = "mm"
[block.words.W]
meaning = "finishing allowance in Z"
unit = "mm"
[block.words.F]
meaning = "feed of the passes"
min_exclusive = 0

[[assumption]]
text = "The contour is cut R times: the first pass lies U (a radius) and W outside the allowance contour, the last on it. The passes between are taken to be evenly spaced, U / (R - 1) apart; the manual does not say. R is rounded to a whole number."
verified = false
manual = "4.2.3, fig. 4.2.3 (a)"

[[assumption]]
text = "Every pass starts at the cycle start point; the approach and the return are rapids, and the cycle ends back at the start point."
verified = false
manual = "4.2.3, fig. 4.2.3 (a)"

[[assumption]]
text = "The first contour block carries G00 or G01 (else PS0065). G40, G41 or G42 between P and Q stop the control (PS0325)."
verified = false
manual = "4.2.3, 4.2.8"

[[example]]
title = "Forged blank, 3 mm stock in X and 2 mm in Z, four passes"
code = '''
G00 X52. Z3.
G73 U3. W2. R4
G73 P10 Q20 U0.4 W0.1 F0.2
N10 G00 X30. Z1.
G01 Z-20. F0.1
X45.
N20 Z-35.
'''
